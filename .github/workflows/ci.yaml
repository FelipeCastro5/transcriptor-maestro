name: CI - Integracion Continua

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: Compilacion sintactica de Backend y Bundle de Frontend Angular
  # -------------------------------------------------------------------------
  build:
    name: Job 1 - Build & Empaquetado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validacion sintactica de Backend Python
        run: |
          python -m py_compile backend/app/core/config.py backend/app/db/session.py backend/app/main.py backend/scripts/init_db.py
          echo "[OK] Validacion de sintaxis Python completada."

      - name: Compilar Bundle de Produccion Frontend Angular
        working-directory: frontend-angular
        run: |
          npm ci || npm install
          npm run build -- --configuration production
          echo "[OK] Compilacion de Angular completada exitosamente."

      - name: Publicar artefacto compilado de Frontend (Retencion 14 dias)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-angular/dist/
          retention-days: 14

  # -------------------------------------------------------------------------
  # JOB 2: Pruebas Automatizadas con Base de Datos PostgreSQL 16 Efimera
  # -------------------------------------------------------------------------
  test:
    name: Job 2 - Pruebas Automatizadas (Pytest + PostgreSQL)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: transcriptor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias optimizadas de Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      - name: Ejecutar Suite de Pruebas Pytest con Cobertura y Reporte JUnit
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+pg8000://postgres:testpassword@localhost:5432/transcriptor_db"
          DB_USER: "postgres"
          DB_PASSWORD: "testpassword"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "transcriptor_db"
          ENVIRONMENT: "testing"
          DEBUG: "false"
        run: |
          mkdir -p ../test-reports
          pytest tests/ --junitxml=../test-reports/junit.xml -v

      - name: Publicar reporte de pruebas JUnit como Artefacto (Retencion 14 dias)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-reports/junit.xml
          retention-days: 14

  # -------------------------------------------------------------------------
  # JOB 3: Seguridad y Analisis Estatico SAST (Bandit + CodeQL)
  # -------------------------------------------------------------------------
  security-sast:
    name: Job 3 - Analisis Estatico SAST (Bandit + CodeQL)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar y ejecutar Bandit (SAST Python)
        run: |
          pip install bandit
          bandit -r backend/app -f json -o bandit-results.json || true
          echo "[OK] Escaneo SAST con Bandit completado."

      - name: Inicializar GitHub CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript

      - name: Ejecutar analisis CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,javascript-typescript"

  # -------------------------------------------------------------------------
  # JOB 4: Empaquetado Docker Non-Root, Escaneo Trivy y Push a Amazon ECR
  # -------------------------------------------------------------------------
  docker:
    name: Job 4 - Docker Packaging, Trivy Scan & Push a Amazon ECR
    needs: [build, test, security-sast]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Extraer Git Short SHA del Commit del PR
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          echo "sha_short=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Short SHA extraido para el contenedor inmutable: $SHORT_SHA"

      - name: Autenticar en AWS para ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Backend Non-Root
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-backend:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-backend:rc-latest

      - name: Construir imagen Frontend Angular + Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-angular
          file: ./frontend-angular/Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-frontend:rc-latest

      - name: Escanear imagen Backend con Aqua Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-backend:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Escanear imagen Frontend con Aqua Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-frontend:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publicar imagenes inmutables en Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-backend:${{ steps.vars.outputs.sha_short }}
          docker push ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-backend:rc-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-frontend:${{ steps.vars.outputs.sha_short }}
          docker push ${{ steps.login-ecr.outputs.registry }}/transcriptor-maestro-frontend:rc-latest
          echo "[OK] Imagenes publicadas exitosamente en Amazon ECR con tag :${{ steps.vars.outputs.sha_short }}"
